<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>登录 · 周计划</title>
  <link rel="stylesheet" href="/entry.css">
  <script src="/login.js" defer></script>
</head>
<body class="auth-page">
  <header class="entry-header">
    <a class="entry-brand" href="/" aria-label="返回周计划首页">周计划</a>
  </header>
  <main class="auth-layout">
    <section class="auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">登录</h1>
      <form id="auth-form">
        <label>用户名<input name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required autofocus></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
        <label id="confirm-field" hidden>确认密码<input name="confirm_password" type="password" autocomplete="new-password"></label>
        <p class="auth-help" id="auth-help" hidden>用户名为 3–32 位字母、数字、下划线或连字符；密码至少 8 位。</p>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="auth-submit" id="auth-submit" type="submit">登录</button>
      </form>
      <p class="auth-alternate"><span id="auth-alternate-text">还没有账号？</span><button type="button" id="auth-mode-toggle">创建账号</button></p>
    </section>
  </main>
</body>
</html>
