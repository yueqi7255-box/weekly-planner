<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <meta name="description" content="周计划：把长期方向写在一边，把本周重点写清楚，再安排每天的行动。">
  <title>周计划 · 从想过的一年，到今天要做的事</title>
  <link rel="stylesheet" href="/entry.css">
  <script src="/portal.js" defer></script>
</head>
<body class="portal-page">
  <header class="entry-header">
    <div class="entry-identity">
      <a class="entry-brand" href="/" aria-label="周计划首页">周计划</a>
      <span class="entry-tagline">把想要的生活，安排进每一周</span>
    </div>
    <a class="entry-login" href="/login">登录</a>
  </header>
  <main class="portal-main">
    <div class="portal-books" aria-hidden="true"></div>
    <div class="portal-content">
      <p class="portal-kicker">一年 52 周 · 从这一周开始</p>
      <h1>从想过的一年，<br>到今天要做的事</h1>
      <p class="portal-description">把长期方向写在一边，把本周重点写清楚，再安排每天的行动。</p>
      <a class="start-button" href="/login?mode=register">开始规划 <span aria-hidden="true">→</span></a>
      <ol class="planning-steps" aria-label="规划方式">
        <li>
          <span class="step-art step-direction" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27V15M16 20c-6 0-9-4-9-10 6 0 9 3 9 10ZM16 17c0-6 3-9 9-10 0 6-3 10-9 10Z"/></svg>
          </span>
          <strong>长期方向</strong>
          <span class="step-summary">记下真正想持续的事</span>
          <span class="step-example">例如：<br>· 持续学习，积累专业能力<br>· 保持健康与稳定的生活</span>
        </li>
        <li>
          <span class="step-art step-week" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="16" height="22" rx="2"/><path d="M12 12h8M12 17h8M12 22h5"/></svg>
          </span>
          <strong>本周目标</strong>
          <span class="step-summary">聚焦学习、实践与工作</span>
          <span class="step-example">例如：<br>· 完成产品原型初稿<br>· 每天运动 30 分钟</span>
        </li>
        <li>
          <span class="step-art step-today" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="16" cy="16" r="5"/><path d="M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M25.9 6.1l-3.5 3.5M9.6 22.4l-3.5 3.5"/></svg>
          </span>
          <strong>今日行动</strong>
          <span class="step-summary">把重点写进每天</span>
          <span class="step-example">例如：<br>· 写完用户访谈提纲<br>· 晚上散步半小时</span>
        </li>
      </ol>
    </div>
  </main>
  <footer class="year-strip" aria-label="全年周次示意">
    <span class="year-caption"><strong id="portal-year"></strong><small>一年，一周接一周</small></span>
    <div class="year-track">
      <div class="month-labels" aria-hidden="true">
        <span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span>
        <span>7月</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span>
      </div>
      <div class="week-ticks" id="week-ticks" aria-hidden="true"></div>
    </div>
    <span class="current-week-label" id="current-week-label"></span>
  </footer>
</body>
</html>
